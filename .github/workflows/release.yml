name: Publish verified package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Match tag and reproduce reviewed archive
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(process.env.RELEASE_TAG, 'v' + JSON.parse(fs.readFileSync('plugin.json')).version);"
          node scripts/build-release.mjs "$RUNNER_TEMP/iqm-release"
      - name: Publish immutable assets through a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; immutable assets will not be overwritten.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/iqm-release"/* --verify-tag --draft --title "$RELEASE_TAG" --notes 'Verified standalone client and skill package. See release.json and the versioned trust record for exact artifact hashes and source provenance.'
          gh release edit "$RELEASE_TAG" --draft=false
