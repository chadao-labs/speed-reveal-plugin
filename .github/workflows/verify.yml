name: Verify standalone package
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use maintained Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify checksums and offline CLI
        run: node scripts/verify-package.mjs
      - name: Reproduce the hash-pinned release archive
        run: node scripts/build-release.mjs "${{ runner.temp }}/iqm-release"
      - name: Verify release rejection boundaries
        run: node --test scripts/build-release.test.mjs
